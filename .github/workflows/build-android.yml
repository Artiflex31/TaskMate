name: Build Android AAB

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      flavor:
        description: "Select Flavor to Build"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ... (Checkout, Setup Java, Setup Flutter wale steps same rahenge) ...

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Get Dependencies
        run: flutter pub get

      # 🔥 MAGIC LINE: Yahan humne flavor pass kiya hai
      - name: Build Release AAB
        run: |
          flutter build appbundle --release \
            --flavor ${{ github.event.inputs.flavor }} \
            -t lib/main_${{ github.event.inputs.flavor }}.dart

      # 🔥 Artifact ka path bhi flavor ke hisaab se badal jayega
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab-${{ github.event.inputs.flavor }}
          path: build/app/outputs/bundle/${{ github.event.inputs.flavor }}Release/app-${{ github.event.inputs.flavor }}-release.aab
