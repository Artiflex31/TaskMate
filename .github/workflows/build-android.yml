name: Build Android AAB

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      flavor:
        description: "Select Flavor to Build"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FLAVOR: ${{ github.event.inputs.flavor || 'dev' }}

    steps:
      # 🔥 1. Sabse pehle code checkout karna zaroori hai
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable" # Version hardcode nahi kiya taaki latest stable use ho

      # 🔥 2. Keystore Decode karo (Folder create karne ki safety ke saath)
      - name: Decode Keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          mkdir -p android
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release AAB
        run: |
          flutter build appbundle --release \
            --flavor ${{ env.FLAVOR }} \
            -t lib/main_${{ env.FLAVOR }}.dart

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab-${{ env.FLAVOR }}
          path: build/app/outputs/bundle/${{ env.FLAVOR }}Release/app-${{ env.FLAVOR }}-release.aab
