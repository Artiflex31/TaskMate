name: Build Android AAB

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      flavor:
        description: "Select Flavor to Build"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 🔥 1. Sabse pehle code checkout karna zaroori hai
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: "stable"

      # 🔥 2. Keystore Decode karo (Folder create karne ki safety ke saath)
      - name: Decode Keystore
        run: |
          mkdir -p android/app  # Safety: Agar folder na ho toh bana do
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          mkdir -p android
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release AAB
        run: |
          flutter build appbundle --release \
            --flavor ${{ github.event.inputs.flavor }} \
            -t lib/main_${{ github.event.inputs.flavor }}.dart

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab-${{ github.event.inputs.flavor }}
          path: build/app/outputs/bundle/${{ github.event.inputs.flavor }}Release/app-${{ github.event.inputs.flavor }}-release.aab
